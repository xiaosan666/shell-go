<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Shell Go</title>
<link rel="stylesheet" href="/css/xterm.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- 登录 -->
<section id="login-view" class="login">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <rect x="1.5" y="3.5" width="29" height="25" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 12l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 20h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Shell Go</h1>
        <p>内网服务器终端 · 全程国密加密</p>
      </div>
    </div>

    <form id="login-form" autocomplete="off" spellcheck="false">
      <label class="field">
        <span>账号</span>
        <input id="login-user" type="text" required autocomplete="username" placeholder="请输入账号">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="login-pass" type="password" required autocomplete="current-password" placeholder="请输入密码">
      </label>
      <button id="login-btn" type="submit" class="primary">登 录</button>
      <p id="login-err" class="err" hidden></p>
    </form>

    <div class="login-foot">
      <span class="dot"></span>SM2 + SM4 + SM3 国密全链路加密
    </div>
  </div>
</section>

<!-- 主界面 -->
<section id="app" class="app" hidden>
  <header class="tabbar">
    <div class="tablist" id="tablist"></div>
    <button class="tab-new" id="tab-new" title="新建终端 (Ctrl+Shift+T)" aria-label="新建终端">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <div class="tabbar-right">
      <button class="icon-btn" id="btn-split" title="左右分屏 (Ctrl+Shift+D)" aria-label="分屏">
        <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.8" y="2.6" width="12.4" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.6v10.8" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-quad" title="四宫格 (Ctrl+Shift+G)" aria-label="四宫格">
        <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.8" y="2.6" width="12.4" height="10.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.6v10.8M1.8 8h12.4" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-rec" title="会话回放" aria-label="会话回放">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6V8l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-files" title="文件管理 (Ctrl+Shift+E)" aria-label="文件管理">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.8 4.2A1.2 1.2 0 013 3h3.1l1.3 1.6H13a1.2 1.2 0 011.2 1.2v6.2A1.2 1.2 0 0113 13.2H3a1.2 1.2 0 01-1.2-1.2V4.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-search" title="搜索 (Ctrl+F)" aria-label="搜索">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="切换明暗主题" aria-label="切换主题">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 010 12z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="btn-logout" title="退出登录" aria-label="退出登录">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 2.5H3.5A1.5 1.5 0 002 4v8a1.5 1.5 0 001.5 1.5H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10 4.5L13.5 8 10 11.5M13 8H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="terminals" id="terminals"></main>

  <footer class="statusbar">
    <span class="st-item"><span class="st-key">主机</span><span id="st-host">—</span></span>
    <span class="st-item"><span class="st-key">用户</span><span id="st-user">—</span></span>
    <span class="st-item"><span class="st-key">角色</span><span id="st-role" class="st-role">—</span></span>
    <span class="grow"></span>
    <span id="st-conn" class="conn">连接中</span>
    <span class="st-item"><span class="st-key">延迟</span><span id="st-lat">—</span></span>
    <span class="st-item" id="st-clock">—</span>
  </footer>

  <div class="searchbar" id="searchbar" hidden>
    <input id="search-input" placeholder="搜索终端内容，回车查找下一个" spellcheck="false">
    <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
    <button id="search-next" title="下一个 (Enter)">↓</button>
    <button id="search-close" title="关闭 (Esc)">✕</button>
  </div>

  <div class="ctxmenu" id="ctxmenu" hidden>
    <button data-act="copy">复制</button>
    <button data-act="paste">粘贴</button>
    <button data-act="selectall">全选</button>
    <button data-act="clear">清屏</button>
    <button data-act="search">搜索…</button>
    <div class="ctx-sep"></div>
    <button data-act="close">关闭标签</button>
  </div>

  <div class="pastebox" id="pastebox" hidden>
    <div class="paste-card">
      <h3>粘贴内容</h3>
      <p class="hint">当前浏览器不允许直接读取剪贴板（非 HTTPS 环境），请在下方输入框中粘贴。</p>
      <textarea id="paste-area" spellcheck="false" placeholder="Ctrl+V 粘贴到此处"></textarea>
      <div class="paste-actions">
        <button id="paste-cancel" class="ghost">取消</button>
        <button id="paste-ok" class="primary small">发送</button>
      </div>
    </div>
  </div>

  <div class="modal" id="recmodal" hidden>
    <div class="rec-card">
      <header class="files-head">
        <h3>会话回放</h3>
        <span class="files-root" id="rec-hint">录制保存在服务端，用于审计与复盘</span>
        <button class="modal-close" id="rec-close" title="关闭 (Esc)" aria-label="关闭">✕</button>
      </header>
      <div class="rec-body">
        <div class="rec-list" id="rec-list"></div>
        <div class="rec-player">
          <div class="rec-screen" id="rec-screen">
            <div class="rec-placeholder" id="rec-placeholder">从左侧选择一条录制开始回放</div>
          </div>
          <div class="rec-controls">
            <button class="ghost" id="rec-play" disabled>播放</button>
            <button class="ghost" id="rec-restart" disabled>重放</button>
            <select id="rec-speed" class="ghost" title="播放速度">
              <option value="1">1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
              <option value="8">8×</option>
            </select>
            <div class="rec-progress"><div class="rec-bar" id="rec-bar"></div></div>
            <span class="rec-time" id="rec-time">00:00 / 00:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="filemodal" hidden>
    <div class="files-card">
      <header class="files-head">
        <h3>文件管理</h3>
        <span class="files-root" id="files-root"></span>
        <button class="modal-close" id="files-close" title="关闭 (Esc)" aria-label="关闭">✕</button>
      </header>
      <div class="files-tools">
        <button class="ghost" id="files-up">↑ 上级</button>
        <button class="ghost" id="files-refresh">刷新</button>
        <input class="files-filter" id="files-filter" placeholder="过滤当前目录…" autocomplete="off" spellcheck="false">
        <span class="grow"></span>
        <button class="ghost" id="files-upload">上传文件</button>
        <button class="ghost" id="files-mkdir">新建目录</button>
        <button class="ghost" id="files-newfile">新建文件</button>
        <input type="file" id="files-input" multiple hidden>
      </div>
      <div class="files-crumb" id="files-crumb"></div>
      <div class="files-list" id="files-list"></div>
      <footer class="files-foot">
        <span id="files-status">就绪</span>
        <span class="grow"></span>
        <span id="files-count"></span>
      </footer>
    </div>
  </div>

  <div class="modal" id="editmodal" hidden>
    <div class="edit-card">
      <header class="files-head">
        <h3 id="edit-title">编辑</h3>
        <span class="files-root" id="edit-path"></span>
        <span class="edit-dirty" id="edit-dirty" hidden>未保存</span>
        <button class="modal-close" id="edit-close" title="关闭 (Esc)" aria-label="关闭">✕</button>
      </header>
      <textarea id="edit-area" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"></textarea>
      <footer class="files-foot">
        <span id="edit-status">Ctrl+S 保存 · Esc 关闭</span>
        <span class="grow"></span>
        <span id="edit-meta"></span>
        <button class="ghost" id="edit-save">保存</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</section>

<script src="/js/vendor/xterm.js"></script>
<script src="/js/vendor/addon-fit.js"></script>
<script src="/js/vendor/addon-search.js"></script>
<script src="/js/vendor/addon-web-links.js"></script>
<script src="/js/vendor/sm2.js"></script>
<script src="/js/vendor/sm3.js"></script>
<script src="/js/vendor/sm4.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
